<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer - deeteeo</title>
    <meta name="description" content="Minimal countdown timers for productivity">
    <meta name="theme-color" content="#111111">
    
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple PWA tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Timer">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111111;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header .tagline {
            font-size: 0.9rem;
            color: #666666;
            font-weight: 300;
        }

        .add-btn {
            display: block;
            width: 60px;
            height: 60px;
            margin: 0 auto 40px;
            background: #222222;
            border: 1px solid #333333;
            border-radius: 50%;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #333333;
            border-color: #444444;
        }

        .timers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .timer {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .timer:hover {
            background: #222222;
            border-color: #444444;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 10px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            color: #ffffff;
        }

        .timer-status {
            font-size: 0.85rem;
            color: #888888;
            font-weight: 300;
        }

        .timer.running {
            border-color: #555555;
        }

        .timer.running .timer-display {
            color: #ffffff;
        }

        .timer.running .timer-status {
            color: #aaaaaa;
        }

        .timer.finished {
            border-color: #666666;
            background: #1f1f1f;
        }

        .timer.finished .timer-display {
            color: #cccccc;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: transparent;
            border: none;
            color: #666666;
            cursor: pointer;
            font-size: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #333333;
            color: #ffffff;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: #333333;
            transition: width 1s linear;
            border-radius: 0 0 12px 12px;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #222222;
        }

        .footer a {
            color: #666666;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 300;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #aaaaaa;
        }

        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 15px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .install-text {
            font-size: 0.85rem;
            color: #cccccc;
        }

        .install-actions {
            display: flex;
            gap: 10px;
        }

        .install-btn, .dismiss-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            border: 1px solid #444444;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .install-btn {
            background: #333333;
            color: #ffffff;
        }

        .install-btn:hover {
            background: #444444;
        }

        .dismiss-btn {
            background: transparent;
            color: #888888;
        }

        .dismiss-btn:hover {
            background: #222222;
            color: #aaaaaa;
        }

        @media (max-width: 600px) {
            .timers-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .timer-display {
                font-size: 2.5rem;
            }
            
            body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Timer</h1>
        <div class="tagline">{focus, create, achieve}</div>
    </div>

    <button class="add-btn" onclick="addTimer()" aria-label="Add Timer">+</button>

    <div class="timers-grid" id="timersContainer">
    </div>

    <div class="footer">
        <a href="https://deeteeo.be" target="_blank">© deeteeo</a>
    </div>

    <div class="install-banner" id="installBanner">
        <div class="install-text">Install for offline use</div>
        <div class="install-actions">
            <button class="install-btn" onclick="installApp()">Install</button>
            <button class="dismiss-btn" onclick="dismissInstall()">Later</button>
        </div>
    </div>

    <script>
        class Timer {
            constructor() {
                this.id = Date.now() + Math.random();
                this.timeLeft = 30;
                this.isRunning = false;
                this.interval = null;
                this.element = null;
                this.create();
            }

            create() {
                const timer = document.createElement('div');
                timer.className = 'timer';
                timer.innerHTML = `
                    <button class="delete-btn" onclick="deleteTimer('${this.id}')" aria-label="Delete timer">&times;</button>
                    <div class="timer-display">${this.timeLeft}</div>
                    <div class="timer-status">Tap to start</div>
                    <div class="progress-bar"></div>
                `;
                
                timer.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('delete-btn')) {
                        this.toggle();
                    }
                });

                this.element = timer;
                document.getElementById('timersContainer').appendChild(timer);
            }

            toggle() {
                if (this.timeLeft === 0) {
                    this.reset();
                } else if (this.isRunning) {
                    this.pause();
                } else {
                    this.start();
                }
            }

            start() {
                this.isRunning = true;
                this.updateDisplay();
                
                this.interval = setInterval(() => {
                    this.timeLeft--;
                    this.updateDisplay();
                    
                    if (this.timeLeft <= 0) {
                        this.finish();
                    }
                }, 1000);
            }

            pause() {
                this.isRunning = false;
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
                this.updateDisplay();
            }

            finish() {
                this.isRunning = false;
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
                this.updateDisplay();
                
                // Vibrate if supported
                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 200]);
                }
            }

            reset() {
                this.pause();
                this.timeLeft = 30;
                this.updateDisplay();
            }

            updateDisplay() {
                const display = this.element.querySelector('.timer-display');
                const status = this.element.querySelector('.timer-status');
                const progressBar = this.element.querySelector('.progress-bar');
                
                display.textContent = this.timeLeft;
                
                // Update progress bar
                const progress = ((30 - this.timeLeft) / 30) * 100;
                progressBar.style.width = progress + '%';
                
                // Update status and styling
                this.element.className = 'timer';
                
                if (this.timeLeft === 0) {
                    this.element.classList.add('finished');
                    status.textContent = 'Finished! Tap to reset';
                } else if (this.isRunning) {
                    this.element.classList.add('running');
                    status.textContent = 'Running... Tap to pause';
                } else {
                    status.textContent = this.timeLeft === 30 ? 'Tap to start' : 'Paused';
                }
            }

            destroy() {
                this.pause();
                if (this.element && this.element.parentNode) {
                    this.element.parentNode.removeChild(this.element);
                }
            }
        }

        // App management
        let timers = [];

        function addTimer() {
            const timer = new Timer();
            timers.push(timer);
        }

        function deleteTimer(id) {
            const index = timers.findIndex(t => t.id == id);
            if (index !== -1) {
                timers[index].destroy();
                timers.splice(index, 1);
            }
        }

        // PWA functionality
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'flex';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('installBanner').style.display = 'none';
                });
            }
        }

        function dismissInstall() {
            document.getElementById('installBanner').style.display = 'none';
            sessionStorage.setItem('installDismissed', 'true');
        }

        // Service worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Check if install was previously dismissed
        if (sessionStorage.getItem('installDismissed')) {
            document.getElementById('installBanner').style.display = 'none';
        }

        // Initialize with one timer
        addTimer();
    </script>
</body>
</html>
